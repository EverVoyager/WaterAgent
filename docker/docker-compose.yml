name: wateragents

services:
  qdrant:
    image: qdrant/qdrant:v1.12.6
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 3s
      retries: 10

  # 会话持久化（sessions）+ 自进化记忆（memories/skills）依赖 MySQL，
  # 缺失时对应 API 硬失败。密码与 docker/.env 的 MYSQL_PASSWORD 对齐。
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-water_agent_dev}
      MYSQL_DATABASE: water_agent
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_storage:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 20

  vllm:
    image: vllm/vllm-openai:v0.7.3
    profiles: ["local-llm"]   # 用本地微调模型时启用：docker compose --profile local-llm up
    # 注意：--enable-auto-tool-choice --tool-call-parser hermes 必需，
    # 否则服务端不解析 <tool_call>，planner 的 Function Calling 链路失效
    # --enable-prefix-caching：KV Cache 前缀复用（planner 多轮/synthesizer 两阶段
    # 重发的相同前缀直接命中，v0.7.3 需显式开启；v0.8+ V1 引擎默认开启）
    command: >
      --model /models/grpo-merged
      --served-model-name water-agent-fc
      --max-model-len 8192
      --gpu-memory-utilization 0.85
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser hermes
    volumes:
      - ${MODEL_DIR:-../train/grpo/outputs}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    environment:
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      # Embedding 独立凭证（留空回退 LLM_*；推理与 embedding 分属不同服务商时必填）
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      AMAP_API_KEY: ${AMAP_API_KEY:-}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-water_agent_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-water_agent}
    depends_on:
      qdrant:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      # 长期记忆双层文件（Agent 反思写入需持久化到宿主机）
      - ../MEMORY.md:/app/MEMORY.md
      - ../memory:/app/memory
      # 会话任务段归档（压缩折叠的原文 + 工具数据，按需还原依赖它）
      - ../session_archive:/app/session_archive
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

  # 一次性任务：构建法规向量库（法规语料已打进镜像，embedding 走 LLM_API_KEY）。
  # Qdrant 是持久卷，只需首次或法规更新后执行：
  #   docker compose --profile init run --rm vector-init
  vector-init:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: wateragents-backend   # 与 backend 服务共用镜像，不重复构建
    profiles: ["init"]
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    depends_on:
      qdrant:
        condition: service_healthy
    command: python backend/build_vector_store.py

  train:
    build:
      context: ..
      dockerfile: docker/train.Dockerfile
    profiles: ["train"]
    volumes:
      - ..:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: python -m train.lora.train_sft

volumes:
  qdrant_storage:
  mysql_storage:
