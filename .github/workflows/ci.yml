name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ====== 后端测试 + lint ======
  backend:
    runs-on: ubuntu-latest

    # sessions/memories/skills API 依赖 MySQL：CI 起真实服务实跑相关测试，
    # 本地无 MySQL 时对应用例自动 skip（skipif on is_skill_store_enabled）
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_mysql_password
          MYSQL_DATABASE: water_agent
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check . --output-format=github

      - name: Test with pytest (backend/tests + train/tests)
        env:
          PYTHONPATH: .
          LLM_API_KEY: sk-test-placeholder
          AMAP_API_KEY: ""
          QDRANT_HOST: "127.0.0.1"
          QDRANT_PORT: "6333"
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: ci_mysql_password
          MYSQL_DATABASE: water_agent
        run: |
          pytest backend/tests train/tests --cov=agent --cov=app --cov-report=xml --cov-report=term -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ====== 前端类型检查 + 构建 ======
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 测试依赖 jsdom@30 / undici@8 要求 node >=22.22，与本地开发版本（24.x）对齐
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
